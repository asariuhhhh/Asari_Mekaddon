plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'



            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://modmaven.dev/'
    }
    maven {
        url = 'https://www.cursemaven.com'
    }


    // Registrate
    maven {
        url = 'https://maven.ithundxr.dev/mirror'
    }

    // ForgeConfigAPIPort
    maven {
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(
            "mezz.jei:jei-1.20.1-forge:15.20.0.106"
    )
    implementation fg.deobf(
            "curse.maven:mekanism-elements-1103224:6537553"
    )
    //implementation fg.deobf(
    //        "curse.maven:patchouli-306770:7731017"
    //)
    runtimeOnly fg.deobf(
            "mekanism:Mekanism:${mekanism_version}:generators"
    )

    compileOnly fg.deobf(
            "mekanism:Mekanism:${mekanism_version}:api"
    )

    implementation fg.deobf(
            "mekanism:Mekanism:${mekanism_version}"
    )

    runtimeOnly fg.deobf(
            "mekanism:Mekanism:${mekanism_version}:generators"
    )
    //implementation fg.deobf(
    //        "curse.maven:applied-energistics-2-223794:7148487"
   // )
  //  runtimeOnly "org.appliedenergistics:guideme:20.1.15"

    implementation(fg.deobf(
            "com.tterrag.registrate:Registrate:${registrate_version}"
    ))

    compileOnly(annotationProcessor(
            "io.github.llamalad7:mixinextras-common:0.4.1"
    ))

    implementation(
            "io.github.llamalad7:mixinextras-forge:0.4.1"
    )
}